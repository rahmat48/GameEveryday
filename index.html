<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game Hub - Kumpulan Game Retro Sci-Fi</title>
    <meta name="description" content="Space Game Hub - Kumpulan game retro sci-fi harian berbasis web. Tantang dirimu dan raih skor tertinggi komandan luar angkasa!">
    <meta name="theme-color" content="#050505">
    <link rel="canonical" href="https://game.rahmatdwi.my.id/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://game.rahmatdwi.my.id/">
    <meta property="og:title" content="Space Game Hub - Kumpulan Game Retro Sci-Fi">
    <meta property="og:description" content="Mainkan game retro sci-fi seru setiap hari langsung di browser tanpa instalasi.">
    <meta property="og:image" content="https://game.rahmatdwi.my.id/assets/img/og-image.png">
    <meta property="og:site_name" content="Space Game Hub">
    <meta property="og:locale" content="id_ID">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://game.rahmatdwi.my.id/">
    <meta name="twitter:title" content="Space Game Hub - Kumpulan Game Retro Sci-Fi">
    <meta name="twitter:description" content="Mainkan game retro sci-fi seru setiap hari langsung di browser tanpa instalasi.">
    <meta name="twitter:image" content="https://game.rahmatdwi.my.id/assets/img/og-image.png">

    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff41'><path d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/></svg>">
    <link rel="stylesheet" href="style.css?v=2">

    <!-- Sentry Error Tracking -->
    <script src="https://browser.sentry-cdn.com/7.114.0/bundle.min.js" crossorigin="anonymous"></script>
    <script>
      if (window.Sentry) {
        const isProduction = window.location.hostname === 'game.rahmatdwi.my.id';
        Sentry.init({
          dsn: window.SENTRY_DSN || "",
          environment: isProduction ? 'production' : 'development',
          ignoreErrors: [
            'ResizeObserver loop limit exceeded',
            'Non-Error promise rejection captured',
            'Network request failed'
          ]
        });
      }
    </script>

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="00000000-0000-0000-0000-000000000000"></script>
</head>
<body>
    <!-- Retro Loading Screen -->
    <div id="loader">
        <div class="box-grid">
            <div class="box"></div><div class="box"></div><div class="box"></div>
            <div class="box"></div><div class="box"></div><div class="box"></div>
            <div class="box"></div><div class="box"></div><div class="box"></div>
        </div>
        <div class="loader-text">MEMUAT SISTEM...</div>
    </div>

    <canvas id="space-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></canvas>
    
    <header>
        <h1>Space Game Hub</h1>
        <p><span data-i18n="heroTagline">Mainkan Game Bertema:</span> <span id="typing-game-type" style="color: #00d4ff; border-bottom: 2px solid #00d4ff;"></span></p>
    </header>

    <!-- Hero / Animated Preview Section -->
    <div style="max-width: 600px; margin: 0 auto 30px auto; text-align: center; border: 2px solid var(--border-color); padding: 20px; background: rgba(10,10,26,0.7); box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <canvas id="preview-anim-canvas" width="480" height="220" style="width: 100%; max-width: 480px; height: auto; border: 2px solid var(--border-color); box-shadow: 0 0 15px var(--glow-color); background: #000; border-radius: 6px; display: block; margin: 0 auto 15px auto; box-sizing: border-box;"></canvas>
        <p data-i18n="heroDesc" style="font-size: 1.2rem; color: #e0e0ff; margin-bottom: 20px;">Masuk sebagai Komandan untuk mengakses misi dan catatan skor game harian.</p>
        <div id="auth-buttons" style="display: flex; justify-content: center; gap: 15px;">
            <button data-i18n="btnLogin" onclick="showAuthModal('login')" style="padding: 12px 30px; font-size: 1.3rem;">LOGIN</button>
            <button data-i18n="btnSignup" onclick="showAuthModal('signup')" style="padding: 12px 30px; font-size: 1.3rem; border-color: #a855f7; color: #a855f7;">AYO DAFTAR SEKARANG</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-color); padding: 30px; border: 2px solid var(--border-color); z-index: 1000; width: 340px; box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <h2 id="modal-title" style="margin-top: 0; font-family: 'Press Start 2P'; font-size: 1rem; text-align: center; color: var(--text-color); text-shadow: 0 0 8px var(--glow-color);">LOGIN</h2>
        
        <div id="auth-error-msg" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; font-size: 1.05rem; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-family: 'VT323', monospace;"></div>

        <div id="signup-extra" style="display: none;">
            <input type="text" id="auth-name" data-i18n-placeholder="commanderNamePlaceholder" placeholder="Nama Komandan" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
            
            <p data-i18n="chooseAvatar" style="margin: 5px 0; font-size: 0.95rem; color: var(--text-color);">Pilih Avatar:</p>
            <div id="avatar-selector" style="display: flex; justify-content: space-around; margin-bottom: 15px;">
                <span onclick="selectAvatar('🚀')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid var(--border-color); border-radius: 4px;">🚀</span>
                <span onclick="selectAvatar('👾')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">👾</span>
                <span onclick="selectAvatar('🤖')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">🤖</span>
                <span onclick="selectAvatar('🛸')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">🛸</span>
            </div>
        </div>

        <input type="email" id="auth-email" data-i18n-placeholder="emailPlaceholder" placeholder="Email Komandan" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
        <input type="password" id="auth-password" data-i18n-placeholder="passwordPlaceholder" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
        
        <div id="forgot-password-link" style="text-align: right; margin-bottom: 15px;">
            <a href="javascript:void(0)" data-i18n="forgotPassword" onclick="handleForgotPassword()" style="color: var(--text-color); font-size: 1.1rem; text-decoration: none; border-bottom: 1px dashed var(--border-color); opacity: 0.85;">Lupa Password?</a>
        </div>

        <button id="auth-submit" onclick="handleAuth()" style="width: 100%; margin-bottom: 10px; font-size: 1.2rem;">SUBMIT</button>
        <button data-i18n="btnCancel" onclick="closeAuthModal()" style="width: 100%; background: transparent; border: 1px solid #ef4444; color: #ef4444; font-size: 1.1rem;">BATAL</button>
    </div>
    <div id="modal-overlay" onclick="closeAuthModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999;"></div>

    <!-- Floating Controls (Mute, Language & Theme) -->
    <div id="floating-controls-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; align-items: center; gap: 12px;">
        <!-- Audio Mute Button -->
        <button id="audio-toggle-btn" onclick="toggleAudio()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding: 0; box-shadow: 0 0 10px var(--glow-color);" title="Mute/Unmute Audio">🔊</button>

        <!-- Language Selector Trigger (Disamping Menu Tema) -->
        <div id="lang-floating-container" style="position: relative;">
            <div id="lang-options" style="display: none; position: absolute; bottom: 45px; right: 0; background: rgba(5,5,5,0.95); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; flex-direction: column; gap: 6px; min-width: 130px; box-shadow: 0 0 15px var(--glow-color);">
                <button onclick="switchLanguage('id')" style="border: none; background: transparent; color: #22c55e; text-align: left; cursor: pointer; padding: 6px 8px; font-family: 'Press Start 2P', monospace; font-size: 10px;">🇮🇩 ID</button>
                <button onclick="switchLanguage('en')" style="border: none; background: transparent; color: #38bdf8; text-align: left; cursor: pointer; padding: 6px 8px; font-family: 'Press Start 2P', monospace; font-size: 10px;">🇬🇧 EN</button>
            </div>
            <div id="lang-trigger" onclick="toggleLangMenu()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--bg-color); border: 2px solid var(--border-color); cursor: pointer; box-shadow: 0 0 10px var(--glow-color); display: flex; align-items: center; justify-content: center; user-select: none;" title="Pilih Bahasa / Language">
                <span id="lang-trigger-btn" style="font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--text-color);">ID</span>
            </div>
        </div>

        <!-- Theme Selector Trigger -->
        <div id="theme-floating-container" style="position: relative;">
            <div id="theme-options" style="display: none; position: absolute; bottom: 45px; right: 0; background: rgba(5,5,5,0.95); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; flex-direction: column; gap: 8px; min-width: 140px; box-shadow: 0 0 15px var(--glow-color);">
                <button onclick="setTheme('purple')" style="border: none; background: transparent; color: #d946ef; text-align: left; cursor: pointer; padding: 5px;">Midnight Purple</button>
                <button onclick="setTheme('green')" style="border: none; background: transparent; color: #00ff41; text-align: left; cursor: pointer; padding: 5px;">Cyber Matrix</button>
                <button onclick="setTheme('light')" style="border: none; background: transparent; color: #0284c7; text-align: left; cursor: pointer; padding: 5px;">Supernova Light</button>
            </div>
            <div id="theme-trigger" onclick="toggleThemeMenu()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--border-color); border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 10px var(--glow-color); display: flex; align-items: center; justify-content: center; user-select: none;" title="Ganti Tema">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="6.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="17.5" cy="10.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="8.5" cy="7.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="6.5" cy="12.5" r=".5" fill="#ffffff"></circle>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
                </svg>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script type="module" src="app.js?v=4"></script>
</body>
</html>
