<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game Hub</title>
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff41'><path d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="space-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></canvas>
    
    <header>
        <h1>Space Game Hub</h1>
        <p>Mainkan Game Bertema: <span id="typing-game-type" style="color: #00d4ff; border-bottom: 2px solid #00d4ff;"></span></p>
    </header>

    <!-- Hero / Animated Preview Section -->
    <div style="max-width: 600px; margin: 0 auto 30px auto; text-align: center; border: 2px solid var(--border-color); padding: 20px; background: rgba(10,10,26,0.7); box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <canvas id="preview-anim-canvas" width="480" height="220" style="width: 100%; max-width: 480px; height: auto; border: 1px dashed var(--border-color); background: #000; border-radius: 4px; display: block; margin: 0 auto 15px auto;"></canvas>
        <p style="font-size: 1.2rem; color: #e0e0ff; margin-bottom: 20px;">Masuk sebagai Komandan untuk mengakses misi dan catatan skor game harian.</p>
        <div id="auth-buttons" style="display: flex; justify-content: center; gap: 15px;">
            <button onclick="showAuthModal('login')" style="padding: 12px 30px; font-size: 1.3rem;">LOGIN</button>
            <button onclick="showAuthModal('signup')" style="padding: 12px 30px; font-size: 1.3rem; border-color: #a855f7; color: #a855f7;">AYO DAFTAR SEKARANG</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-color); padding: 30px; border: 2px solid var(--border-color); z-index: 1000; width: 340px; box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <h2 id="modal-title" style="margin-top: 0; font-family: 'Press Start 2P'; font-size: 1rem; text-align: center; color: var(--text-color); text-shadow: 0 0 8px var(--glow-color);">LOGIN</h2>
        
        <div id="auth-error-msg" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; font-size: 1.05rem; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-family: 'VT323', monospace;"></div>

        <div id="signup-extra" style="display: none;">
            <input type="text" id="auth-name" placeholder="Nama Komandan" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
            
            <p style="margin: 5px 0; font-size: 0.95rem; color: var(--text-color);">Pilih Avatar:</p>
            <div id="avatar-selector" style="display: flex; justify-content: space-around; margin-bottom: 15px;">
                <span onclick="selectAvatar('🚀')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid var(--border-color); border-radius: 4px;">🚀</span>
                <span onclick="selectAvatar('👾')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">👾</span>
                <span onclick="selectAvatar('🤖')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">🤖</span>
                <span onclick="selectAvatar('🛸')" class="avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;">🛸</span>
            </div>
        </div>

        <input type="email" id="auth-email" placeholder="Email Komandan" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
        <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 12px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
        
        <div id="forgot-password-link" style="text-align: right; margin-bottom: 15px;">
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="color: var(--text-color); font-size: 1.1rem; text-decoration: none; border-bottom: 1px dashed var(--border-color); opacity: 0.85;">Lupa Password?</a>
        </div>

        <button id="auth-submit" onclick="handleAuth()" style="width: 100%; margin-bottom: 10px; font-size: 1.2rem;">SUBMIT</button>
        <button onclick="closeAuthModal()" style="width: 100%; background: transparent; border: 1px solid #ef4444; color: #ef4444; font-size: 1.1rem;">BATAL</button>
    </div>
    <div id="modal-overlay" onclick="closeAuthModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999;"></div>

    <!-- Floating Controls (Mute & Theme) -->
    <div id="floating-controls-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; align-items: center; gap: 12px;">
        <!-- Audio Mute Button -->
        <button id="audio-toggle-btn" onclick="toggleAudio()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding: 0; box-shadow: 0 0 10px var(--glow-color);" title="Mute/Unmute Audio">🔊</button>

        <!-- Theme Selector Trigger -->
        <div id="theme-floating-container" style="position: relative;">
            <div id="theme-options" style="display: none; position: absolute; bottom: 45px; right: 0; background: rgba(5,5,5,0.95); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; flex-direction: column; gap: 8px; min-width: 140px; box-shadow: 0 0 15px var(--glow-color);">
                <button onclick="setTheme('green')" style="border: none; background: transparent; color: #00ff41; text-align: left; cursor: pointer; padding: 5px;">Cyber Matrix</button>
                <button onclick="setTheme('purple')" style="border: none; background: transparent; color: #d946ef; text-align: left; cursor: pointer; padding: 5px;">Midnight Purple</button>
                <button onclick="setTheme('light')" style="border: none; background: transparent; color: #0284c7; text-align: left; cursor: pointer; padding: 5px;">Supernova Light</button>
            </div>
            <div id="theme-trigger" onclick="toggleThemeMenu()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--border-color); border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 10px var(--glow-color);" title="Ganti Tema"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
