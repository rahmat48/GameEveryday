<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game Hub - Hub Komandan</title>
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff41'><path d='M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="space-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></canvas>
    
    <header>
        <div id="user-info" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px;">
            <p id="user-email" style="font-size: 1.5rem; margin: 0; cursor: pointer;" onclick="openProfileModal()" title="Klik untuk edit profil"></p>
            <span id="user-flight-hours" style="font-size: 1.1rem; color: #f59e0b; border: 1px solid #f59e0b; padding: 4px 8px; border-radius: 4px; cursor: pointer;" onclick="openFlightHoursLeaderboard()" title="Klik untuk melihat Leaderboard Jam Terbang Komandan">⏱ JAM TERBANG: 0j 0m</span>
            <button onclick="openProfileModal()" style="padding: 6px 12px; font-size: 0.9rem; border-color: #38bdf8; color: #38bdf8;">EDIT PROFIL</button>
            <button onclick="logout()" style="padding: 6px 12px; font-size: 0.9rem;">LOGOUT</button>
        </div>
        <h1>MISSION CONTROL</h1>
        <p>Mainkan Game Bertema: <span id="typing-game-type" style="color: #00d4ff; border-bottom: 2px solid #00d4ff;"></span></p>
    </header>

    <main id="game-list">
        <!-- Games will be loaded here -->
    </main>

    <!-- Profile Setup Modal -->
    <div id="profile-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 5, 5, 0.95); padding: 30px; border: 2px solid var(--border-color); z-index: 1000; width: 340px; box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <h2 style="margin-top: 0; font-family: 'Press Start 2P'; font-size: 1rem; text-align: center; color: var(--text-color);">DATA KOMANDAN</h2>
        <p style="font-size: 1rem; color: #cbd5e1; text-align: center; margin-bottom: 15px;">Atur nama panggilan dan avatar luar angkasa Anda:</p>
        
        <input type="text" id="profile-name-input" placeholder="Nama Komandan" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--input-text); font-family: 'VT323', monospace; font-size: 1.25rem; box-sizing: border-box; border-radius: 4px;">
        
        <p style="margin: 5px 0; font-size: 0.95rem; color: #e0e0ff;">Pilih Avatar:</p>
        <div id="profile-avatar-selector" style="display: flex; justify-content: space-around; margin-bottom: 20px;">
            <span onclick="selectProfileAvatar('🚀')" class="profile-avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px;">🚀</span>
            <span onclick="selectProfileAvatar('👾')" class="profile-avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px;">👾</span>
            <span onclick="selectProfileAvatar('🤖')" class="profile-avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px;">🤖</span>
            <span onclick="selectProfileAvatar('🛸')" class="profile-avatar-opt" style="cursor: pointer; font-size: 1.6rem; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px;">🛸</span>
        </div>

        <button onclick="saveUserProfile()" style="width: 100%; margin-bottom: 10px; font-size: 1.1rem;">SIMPAN DATA</button>
        <button onclick="closeProfileModal()" style="width: 100%; background: transparent; border: 1px solid #ef4444; color: #ef4444; font-size: 1.1rem;">BATAL</button>
    </div>
    <div id="profile-modal-overlay" onclick="closeProfileModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999;"></div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-color); padding: 30px; border: 2px solid var(--border-color); z-index: 1000; width: 380px; max-width: 90%; box-shadow: 0 0 25px var(--glow-color); border-radius: 8px;">
        <h2 id="lb-modal-title" style="margin-top: 0; font-family: 'Press Start 2P'; font-size: 0.95rem; text-align: center; color: var(--text-color);">LEADERBOARD</h2>
        <p id="lb-game-name" style="font-size: 1.1rem; color: #38bdf8; text-align: center; margin-bottom: 15px;"></p>
        
        <div id="lb-list-container" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px; font-size: 1.15rem;">
            <p style="text-align: center; opacity: 0.7;">Memuat data skor...</p>
        </div>

        <button onclick="closeLeaderboardModal()" style="width: 100%; font-size: 1.1rem;">TUTUP</button>
    </div>
    <div id="leaderboard-overlay" onclick="closeLeaderboardModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999;"></div>

    <!-- Floating Controls (Mute & Theme) -->
    <div id="floating-controls-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; align-items: center; gap: 12px;">
        <!-- Audio Mute Button -->
        <button id="audio-toggle-btn" onclick="toggleAudio()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding: 0; box-shadow: 0 0 10px var(--glow-color);" title="Mute/Unmute Audio">🔊</button>

        <!-- Theme Selector Trigger -->
        <div id="theme-floating-container" style="position: relative;">
            <div id="theme-options" style="display: none; position: absolute; bottom: 45px; right: 0; background: rgba(5,5,5,0.95); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; flex-direction: column; gap: 8px; min-width: 140px; box-shadow: 0 0 15px var(--glow-color);">
                <button onclick="setTheme('purple')" style="border: none; background: transparent; color: #d946ef; text-align: left; cursor: pointer; padding: 5px;">Midnight Purple</button>
                <button onclick="setTheme('green')" style="border: none; background: transparent; color: #00ff41; text-align: left; cursor: pointer; padding: 5px;">Cyber Matrix</button>
                <button onclick="setTheme('light')" style="border: none; background: transparent; color: #0284c7; text-align: left; cursor: pointer; padding: 5px;">Supernova Light</button>
            </div>
            <div id="theme-trigger" onclick="toggleThemeMenu()" style="width: 35px; height: 35px; border-radius: 50%; background: var(--border-color); border: 2px solid #fff; cursor: pointer; box-shadow: 0 0 10px var(--glow-color); display: flex; align-items: center; justify-content: center; user-select: none;" title="Ganti Tema">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="6.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="17.5" cy="10.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="8.5" cy="7.5" r=".5" fill="#ffffff"></circle>
                    <circle cx="6.5" cy="12.5" r=".5" fill="#ffffff"></circle>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
                </svg>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
